<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3f9c">
  <meta name="description" content="WarungPintar: pencatatan penjualan, stok, kasbon, dan laporan untung rugi untuk warung dan UMKM. Bisa dipakai tanpa internet.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <title>WarungPintar</title>
</head>
<body>
  <div id="boot-loader" class="boot-loader" role="status" aria-live="polite">
    <span class="boot-spinner" aria-hidden="true"></span>
    <strong>WarungPintar</strong>
    <span id="loading-message">Memuat aplikasi...</span>
  </div>
  <header class="top no-print">
    <div><p class="brand" id="toko">WarungPintar</p><h1 id="judul">Beranda</h1></div>
    <div class="top-r"><span id="net" class="chip ok">Online</span><span id="sync"></span><span id="role"></span></div>
  </header>
  <main id="view" aria-live="polite"><p class="muted">Memuat...</p></main>
  <nav id="nav" class="bottom no-print" aria-label="Menu utama"></nav>
  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" role="status"></div>
  <noscript><p>WarungPintar membutuhkan JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
